syntax = "proto3";
package file_processor;

message Metadata {
  string file_name = 1;
  string output_format = 2;
  int32 width = 3;
  int32 height = 4;
}
// Primeiro metadata; depois um ou mais blocos content.
message FileRequest {
  oneof payload {
    Metadata metadata = 1;
    bytes content = 2;
  }
}
message FileResponse {
  string file_name = 1;
  bytes content = 2;
}
message HealthRequest {}
message HealthResponse { string status = 1; }
service FileProcessorService {
  rpc CompressPDF(stream FileRequest) returns (stream FileResponse);
  rpc ConvertToTXT(stream FileRequest) returns (stream FileResponse);
  rpc ConvertImageFormat(stream FileRequest) returns (stream FileResponse);
  rpc ResizeImage(stream FileRequest) returns (stream FileResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
