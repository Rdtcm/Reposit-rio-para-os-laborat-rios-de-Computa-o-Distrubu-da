name: sctec-lab6
services:
  relatorio:
    profiles: ["ferramentas"]
    build:
      context: .
      dockerfile: Dockerfile.relatorio
    volumes:
      - ./:/lab
  servico-coordenador:
    build: ./servico-coordenador
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20
  servico-agendamento:
    build: ./servico-agendamento
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      COORDENADOR_URL: http://servico-coordenador:3000
      DATABASE_URL: sqlite:////dados/agenda.db
      LOG_PATH: /dados/app.log
      LOCK_ENABLED: "true"
    volumes:
      - agenda:/dados
    depends_on:
      servico-coordenador:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 3s
      timeout: 2s
      retries: 20
  demonstracao-sem-lock:
    profiles: ["experimentos"]
    build: ./servico-agendamento
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      DATABASE_URL: sqlite:////dados/sem-lock.db
      LOG_PATH: /dados/app.log
      LOCK_ENABLED: "false"
      DEMO_DELAY_SECONDS: "1"
    volumes:
      - sem-lock:/dados
  demonstracao-com-lock:
    profiles: ["experimentos"]
    build: ./servico-agendamento
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      COORDENADOR_URL: http://servico-coordenador:3000
      DATABASE_URL: sqlite:////dados/com-lock.db
      LOG_PATH: /dados/app.log
      LOCK_ENABLED: "true"
      DEMO_DELAY_SECONDS: "1"
    volumes:
      - com-lock:/dados
    depends_on:
      servico-coordenador:
        condition: service_healthy
volumes:
  agenda:
  sem-lock:
  com-lock:
